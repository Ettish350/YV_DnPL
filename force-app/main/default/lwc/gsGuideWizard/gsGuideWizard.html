<template>
    <div class="screen" dir="rtl" lang="he">
        <div class="strip">
            <div class="kicker">{counter}</div>
            <h2 class="title">{headerText}</h2>
            <div class="chipsrow" role="group" aria-label="הקבוצות בהזמנה">
                <template for:each={chips} for:item="c">
                    <button key={c.key} type="button" class={c.cls} aria-pressed={c.pressed}
                            data-index={c.index} onclick={handleJump}>
                        <span class="gtop"><span class="gicon">{c.icon}</span><span class="gname">{c.name}</span></span>
                        <span class="gtime">{c.time}</span>
                        <span class="gline">{c.line}</span>
                    </button>
                </template>
            </div>
            <div class="legend">{summary}</div>
        </div>

        <template lwc:if={noFullMatch}>
            <div class="note warnnote"><b>אין התאמה מלאה.</b> אפשר לבחור את הקרוב ביותר, לראות מה חסר, או לדלג.</div>
        </template>

        <div class="toolbar">
            <div class="search">
                <input type="search" placeholder="חיפוש מדריך לפי שם" aria-label="חיפוש מדריך לפי שם"
                       value={query} oninput={handleSearch} />
                <template lwc:if={searching}>
                    <button type="button" class="clear" aria-label="נקה חיפוש" onclick={handleClear}>✕</button>
                </template>
            </div>
            <template lwc:if={has25}>
                <label class="filter">
                    <span class="flabel">סינון:</span>
                    <input type="checkbox" checked={only25} onchange={handleOnly25} />
                    <span class="ftext">הצג רק מדריכי 25 ({n25})</span>
                </label>
            </template>
        </div>
        <template lwc:if={filterNote}>
            <div class="filternote">{filterNote}</div>
        </template>

        <div class="selbar" aria-live="polite">{selectedSummary}</div>

        <template lwc:if={showSpinner}>
            <p class="loading">טוען מדריכים…</p>
        </template>
        <template lwc:if={hasError}>
            <div class="note errnote">{error}</div>
        </template>

        <template lwc:if={showCards}>
            <div class="cards" role="radiogroup" aria-label="בחר מדריך">
                <template for:each={listRows} for:item="r">
                    <div key={r.key} class="row">
                        <template lwc:if={r.isSection}>
                            <template lwc:if={r.toggle}>
                                <button type="button" class="section toggler" aria-expanded={r.expanded} onclick={handleNearToggle}>
                                    <span>{r.title} <small>({r.count}) · {r.sub}</small></span>
                                    <span class="arrow">{r.arrow}</span>
                                </button>
                            </template>
                            <template lwc:else>
                                <div class="section"><span>{r.title} <small>({r.count})</small></span></div>
                            </template>
                        </template>

                        <template lwc:if={r.isCard}>
                            <button type="button" class={r.cls} role="radio" aria-checked={r.checked}
                                    aria-disabled={r.disabled} disabled={r.disabled}
                                    data-value={r.value} data-name={r.name} onclick={handleSelect}>
                                <span class="avatar">{r.initial}</span>
                                <span class="body">
                                    <span class="name">{r.name}
                                        <template lwc:if={r.tag}><span class="tag">{r.tag}</span></template>
                                    </span>
                                    <span class="chips">
                                        <template lwc:if={r.full}><span class="chip ok">✓ התאמה מלאה: מוסמך, זמין ופנוי</span></template>
                                        <template for:each={r.gaps} for:item="g">
                                            <span key={g.key} class={g.cls}>{g.text}</span>
                                        </template>
                                    </span>
                                </span>
                                <span class="tick"></span>
                            </button>
                        </template>

                        <template lwc:if={r.isMore}>
                            <button type="button" class="morebtn" onclick={handleMore}>{r.label}</button>
                        </template>

                        <template lwc:if={r.isNote}>
                            <p class="listnote">{r.text}</p>
                        </template>
                    </div>
                </template>

                <button type="button" class={skipCls} role="radio" aria-checked={skipChecked}
                        data-value="SKIP" onclick={handleSelect}>
                    <span class="avatar">↷</span>
                    <span class="body">
                        <span class="name">אשבץ מאוחר יותר</span>
                        <span class="chips"><span class="chip muted">הקבוצה תישאר ממתינה לשיבוץ</span></span>
                    </span>
                    <span class="tick"></span>
                </button>
            </div>
        </template>

        <div class="foot">
            <div class="navbtns">
                <button type="button" class="btn ghost" disabled={prevDisabled} onclick={handlePrev}>→ הקודמת</button>
                <button type="button" class="btn ghost" onclick={handleSummary}>לסיכום</button>
            </div>
            <button type="button" class="btn" onclick={handleNext}>{nextLabel}</button>
        </div>
    </div>
</template>
