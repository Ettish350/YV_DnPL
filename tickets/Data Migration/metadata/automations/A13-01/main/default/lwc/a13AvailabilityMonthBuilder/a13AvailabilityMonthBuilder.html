<template>
    <lightning-card title="בניית חודשי זמינות" icon-name="standard:event">
        <div class="slds-p-horizontal_medium" dir="rtl">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="שנה" value={year} options={yearOptions} onchange={handleYear}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="חודש" value={month} options={monthOptions} onchange={handleMonth}></lightning-combobox>
                </div>
            </div>

            <template lwc:if={stats}>
                <div class="slds-grid slds-gutters slds-m-bottom_medium slds-text-align_center">
                    <div class="slds-col">
                        <p class="slds-text-title">מדריכים פעילים</p>
                        <p class="slds-text-heading_large">{stats.activeGuides}</p>
                    </div>
                    <div class="slds-col">
                        <p class="slds-text-title">חודשים שנבנו</p>
                        <p class="slds-text-heading_large">{stats.existing}</p>
                    </div>
                    <div class="slds-col">
                        <p class="slds-text-title">חסרים</p>
                        <p class="slds-text-heading_large">{stats.missing}</p>
                    </div>
                </div>
            </template>

            <template lwc:if={loading}>
                <lightning-spinner alternative-text="טוען" size="small"></lightning-spinner>
            </template>

            <lightning-button variant="brand" label="בנה חודשים חסרים" onclick={handleRun} disabled={runDisabled}></lightning-button>

            <template lwc:if={result}>
                <div class="slds-m-top_medium">
                    <p class={resultClass}>{result.message}</p>
                    <template for:each={result.errors} for:item="err">
                        <p key={err} class="slds-text-color_error">{err}</p>
                    </template>
                </div>
            </template>
            <template lwc:if={error}>
                <p class="slds-m-top_medium slds-text-color_error">{error}</p>
            </template>
        </div>
    </lightning-card>
</template>
